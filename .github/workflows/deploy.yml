# Publica la landing en Cloudflare al hacer push a main.
#
# Quien edita la página no necesita saber desplegar: hace push y esto la
# actualiza en terminus.danil.ai. En un repo público las Actions son gratis.
#
# Requisito único: el secreto CLOUDFLARE_API_TOKEN en el repo
# (Settings → Secrets and variables → Actions). Un token de Cloudflare con
# permiso "Edit Cloudflare Workers". La cuenta va en wrangler.jsonc (no es
# secreto); el token sí.
name: Desplegar la landing

on:
  push:
    branches: [main]
  # Permite dispararlo a mano desde la pestaña Actions.
  workflow_dispatch:
  # La página enseña la versión publicada y la resuelve AL COMPILAR, así que
  # sin esto una release nueva no aparecería hasta el siguiente cambio de la
  # landing. Cada hora se vuelve a compilar y a desplegar: el número se pone al
  # día solo, sin que nadie tenga que acordarse — que es justo lo que se quería
  # evitar al no escribirlo a mano.
  #
  # Es barato: en un repo público las Actions no gastan minutos, y el
  # despliegue es un sitio estático de una página.
  schedule:
    - cron: "17 * * * *"

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Wrangler 4.x (el que usa el proyecto) exige Node 22+. Con Node 20 la
          # acción cae a un wrangler viejo que no despliega un Worker de solo
          # assets, y falla con «Missing entry-point».
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        # El token es el del propio flujo, y solo sirve para preguntarle a la
        # API por la última release. Sin él las IP de Actions comparten el tope
        # de 60 peticiones por hora y la consulta se rechaza justo los días de
        # más despliegues — la página saldría sin número.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Desplegar a Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
